name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: whiskers
          POSTGRES_PASSWORD: whiskers
          POSTGRES_DB: whiskers_watch
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://whiskers:whiskers@localhost:5432/whiskers_watch
      JWT_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run migrate
      - name: Start API
        run: |
          bun index.ts &
          for i in $(seq 1 30); do curl -sf http://localhost:3001/api/health && break; sleep 1; done
      - name: Unit + integration tests
        run: bun test
        env:
          API_URL: http://localhost:3001

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t whiskers-watch .
